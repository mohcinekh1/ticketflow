services:
  discovery-service:
    build:
      context: ..
      dockerfile: services/discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    depends_on:
      - discovery-service
      - config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    restart: on-failure
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - discovery-service
      - config-server
      - customer-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    restart: on-failure
    ports:
      - "8080:8080"
